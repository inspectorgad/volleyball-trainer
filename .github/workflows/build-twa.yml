name: Build Android APK

# The Trusted Web Activity wraps the deployed PWA, so it only needs rebuilding
# when the Android project changes — a content change ships through GitHub
# Pages and the app picks it up on next launch with no reinstall.
on:
  push:
    # The feature branch is included so the Android build gets exercised before
    # merge; this environment has no Android SDK and its egress policy blocks
    # Google's Maven, so CI is the only place the APK can actually compile.
    # Drop the claude/** entry once this lands on main.
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/build-twa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug --no-daemon

      # Catches the failure mode that matters most: an APK whose signing
      # fingerprint is not the one assetlinks.json pins, which builds and
      # installs fine but silently leaves the browser URL bar showing.
      - name: Check signing fingerprint matches assetlinks.json
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # apksigner prints both a certificate and a public-key SHA-256; pin
          # the certificate one, which is what Digital Asset Links compares.
          APK_FP=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' \
            | tr 'a-z' 'A-Z' | sed 's/\(..\)/\1:/g; s/:$//')
          PINNED=$(python3 -c "import json;print(json.load(open('android/site-root/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")
          echo "APK signed with : $APK_FP"
          echo "assetlinks pins : $PINNED"
          if [ "$APK_FP" != "$PINNED" ]; then
            echo "::error::Signing fingerprint does not match assetlinks.json. The TWA would show a browser URL bar."
            exit 1
          fi
          echo "Fingerprints match — Digital Asset Links will verify."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volleyball-trainer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Rolling release so a phone can install straight from a stable URL:
      # https://github.com/inspectorgad/volleyball-trainer/releases/latest/download/volleyball-trainer.apk
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Rolling release: always carries the newest Volleyball Trainer APK. Download volleyball-trainer.apk below and install it on your Android device. App content updates over the air from GitHub Pages — only Android changes need a reinstall."
          gh release view latest-apk --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create latest-apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Volleyball Trainer - latest build" \
              --notes "$NOTES" \
              --latest
          gh release edit latest-apk --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          cp android/app/build/outputs/apk/debug/app-debug.apk volleyball-trainer.apk
          gh release upload latest-apk volleyball-trainer.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
